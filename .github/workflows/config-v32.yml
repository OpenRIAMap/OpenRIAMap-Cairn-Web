name: Config V3.2 verification

on:
  push:
    branches: [codex/ria-config-runtime-v32-integration-20261014]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full code regressions (once)
        run: npm run verify:ci
      - run: npm run build
      - name: Verify downstream integration contracts
        run: |
          npm run test:workspace-transition-coordinator
          npm run test:feature-module-contract
          npm run test:data-source-selection
          npm run test:formal-release-reader
          npm run test:formal-media-reader
          npm run test:player-polling-policy
          npm run validate:formal-data-source-runtime
          npm run test:review-package-contract
          npm run test:review-package-profile-auth
          npm run test:review-auth-routes
          npm run test:review-status-board
          npm run test:review-workspace-contracts
          npm run test:review-control-binding
          npm run test:review-automation-gate
          npm run test:review-relay-transfer-port
          npm run test:review-control-port
          npm run test:review-workflow-broker-actor
          npm run validate:team-review-authorization
          npm run validate:storage-profiles
          npm run validate:feature-data-contract
          npm run validate:media-index-contract
          npm run test:multipart-geometry
          npm run validate:project-config
          npm run validate:native-relay-accept-guards
          npm run validate:native-relay-config-resolver
      - name: Studio workspace browser regressions (local-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/studio-browser-venv"
          "$RUNNER_TEMP/studio-browser-venv/bin/pip" install websocket-client==1.8.0
          export CAIRNMAP_CDP_PORT=9502
          export CAIRNMAP_APP_URL=http://127.0.0.1:5298
          export CAIRNMAP_ACCEPTANCE_OUT="$RUNNER_TEMP/studio-browser/verification"
          mkdir -p "$CAIRNMAP_ACCEPTANCE_OUT"
          npm run dev -- --host 127.0.0.1 --port 5298 --strictPort > "$RUNNER_TEMP/studio-vite.log" 2>&1 &
          studio_vite_pid=$!
          studio_chrome_pid=''
          trap 'kill "$studio_vite_pid" ${studio_chrome_pid:-} 2>/dev/null || true' EXIT
          studio_chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$studio_chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-component-update --no-first-run --no-default-browser-check \
            --remote-debugging-port=9502 --remote-allow-origins=http://127.0.0.1:9502 \
            --host-resolver-rules='MAP * ~NOTFOUND, EXCLUDE localhost, EXCLUDE 127.0.0.1' \
            --user-data-dir="$RUNNER_TEMP/studio-browser-profile" about:blank > "$RUNNER_TEMP/studio-chrome.log" 2>&1 &
          studio_chrome_pid=$!
          for attempt in $(seq 1 60); do
            if curl --noproxy '*' -fsS "$CAIRNMAP_APP_URL/" > /dev/null 2>&1 && curl --noproxy '*' -fsS http://127.0.0.1:9502/json/version > /dev/null 2>&1; then break; fi
            sleep 0.5
          done
          # Start the service-port fixture before Studio tests intentionally leave
          # unsaved diagnostic drafts that correctly block page navigation.
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/review_revision_save_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/category_authoring_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/studio_workspace_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c15_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c14_render_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c15_render_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/workflow_classification_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/classification_capture_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/single_entry_drawing_acceptance.py
          node scripts/config-tools/verify-single-entry-browser-records.mjs
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/saved_layer_five_fixes_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/full_mode_selection_array_acceptance.py
          node scripts/config-tools/verify-full-mode-array-browser-record.mjs
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c16_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c16_tools_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c16_card_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/image_library_acceptance.py
          "$RUNNER_TEMP/studio-browser-venv/bin/python" scripts/config-tools/browser/c17_studio_acceptance.py
